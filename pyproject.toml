[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyardl"
# La version vit dans src/pyardl/__init__.py et NULLE PART AILLEURS.
# Deux emplacements finissent toujours par diverger, et la CI verifie en
# plus que l'etiquette git correspond a cette valeur.
dynamic = ["version"]
description = "Économétrie des séries temporelles ARDL : estimation et algèbre ECM exacte, bounds tests à trois tests avec classification des dégénérescences, valeurs critiques tracées jusqu'à leur source, inférence bootstrap, NARDL, QARDL, Fourier, panels hétérogènes et simulations dynamiques."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Komlan Matthania Adjoh", email = "komlanadjohmatthania@gmail.com" },
]
keywords = [
    "ardl",
    "cointegration",
    "bounds-test",
    "error-correction",
    "econometrics",
    "time-series",
    "nardl",
    "qardl",
    "panel-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
bootstrap = ["arch>=6.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # Dépendances optionnelles du package, requises en test : sans elles
    # les verrous de concordance externe (DF-GLS contre arch) et les
    # tests de tracés sont SKIP en silence, et la CI passe au vert en
    # ayant sauté sa validation la plus importante.
    "arch>=6.3",
    "matplotlib>=3.8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/Matth-analyst/pyardl"
Documentation = "https://github.com/Matth-analyst/pyardl/tree/main/docs"
Repository = "https://github.com/Matth-analyst/pyardl"
Changelog = "https://github.com/Matth-analyst/pyardl/blob/main/CHANGELOG.md"
Issues = "https://github.com/Matth-analyst/pyardl/issues"

[tool.hatch.version]
path = "src/pyardl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyardl"]
# Le noyau natif optionnel n'entre PAS dans la roue publiee. Il est
# specifique a une plateforme et a une version de Python ; l'embarquer
# depuis la machine de build livrerait un binaire qui ne se charge nulle
# part ailleurs, et ferait de pyardl un paquet non universel alors qu'il
# est pur Python. Qui le veut le compile (python rust/build.py).
exclude = ["_rust.pyd", "_rust.so", "_rust.*.pyd", "_rust.*.so"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
# fichiers GÉNÉRÉS par les scripts de validation (en-têtes de provenance)
extend-exclude = ["validation/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# 3.12, alors que le package supporte 3.11+ : les stubs de numpy >= 2.5
# utilisent la syntaxe `type` (PEP 695), que mypy refuse de parser sous
# une cible 3.11 — il s'arrête sur numpy/__init__.pyi avant même de
# regarder notre code. Le typage n'est pas un comportement d'exécution ;
# la compatibilité 3.11 réelle est vérifiée par la matrice pytest, et le
# style 3.11 par ruff (target-version = "py311").
python_version = "3.12"
packages = ["pyardl"]
mypy_path = "src"
strict = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --doctest-glob="*.md" : les blocs `>>>` des vignettes de docs/ sont
# EXECUTES, pas seulement relus. Spec 28 §3 le demande, et la raison est
# concrete : en ecrivant docs/common-mistakes.md j'ai invente le tableau
# comparant les cinq cas deterministes ; le doctest l'a refuse dans la
# minute. Une doc non executee derive en silence, et ses chiffres ont
# exactement l'air de chiffres justes.
#
# Les pages sans ligne `>>>` ne sont simplement pas collectees : le
# reglage n'impose rien aux pages de prose.
addopts = "-ra --strict-markers -p no:dash --doctest-glob=*.md"
markers = [
    "fast_mc: Monte Carlo rapide (CI), réplications réduites",
    "slow: Monte Carlo complet ou calculs longs (hors CI standard)",
    # Ce marqueur ne DÉSELECTIONNE plus rien : la CI et la Definition of
    # Done lancent `-m "not slow"`, donc ces tests s'exécutent. Il reste
    # une étiquette de provenance — d'où viennent les valeurs de
    # référence — et non une exclusion. Un test dont la donnée n'est pas
    # redistribuable porte en plus un `skipif` explicite (spec 17).
    "external: valeurs de référence produites par un script R/Stata externe",
    "needs_review: interprétation d'une spec ambiguë en attente de revue (voir docs/QUESTIONS.md)",
]

[tool.coverage.run]
source = ["src/pyardl"]
# ks2020_finite.py (voie A2, surfaces K&S finies-T) est expérimental et
# bloqué par une demande de permission en cours auprès des auteurs :
# ses tests sont skip tant que la réponse n'est pas reçue (voir
# docs/QUESTIONS.md et docs/DEVIATIONS.md, entrée "voie A2"). Exclu du
# calcul de couverture pour ne pas faire baisser le seuil global ;
# à réintégrer une fois la voie A2 validée et testée normalement.
omit = ["src/pyardl/critical_values/ks2020_finite.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
