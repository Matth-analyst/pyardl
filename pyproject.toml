[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ardlpy"
version = "0.1.0.dev0"
description = "Économétrie des modèles ARDL : estimation, bounds tests de cointégration, inférence bootstrap, NARDL/QARDL/Fourier, panels hétérogènes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ardlpy contributors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
bootstrap = ["arch>=6.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ardlpy"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
# fichiers GÉNÉRÉS par les scripts de validation (en-têtes de provenance)
extend-exclude = ["validation/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
packages = ["ardlpy"]
mypy_path = "src"
strict = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:dash"
markers = [
    "fast_mc: Monte Carlo rapide (CI), réplications réduites",
    "slow: Monte Carlo complet ou calculs longs (hors CI standard)",
    "external: nécessite l'exécution d'un script R/Stata externe (valeurs non encore disponibles)",
    "needs_review: interprétation d'une spec ambiguë en attente de revue (voir docs/QUESTIONS.md)",
]

[tool.coverage.run]
source = ["src/ardlpy"]

[tool.coverage.report]
fail_under = 90
show_missing = true
