name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Monte Carlo complets, une fois par nuit (03:00 UTC).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Une seule exécution par branche ET PAR DECLENCHEUR.
#
# `github.event_name` fait partie du groupe, et ce n'est pas un detail
# de forme. Sans lui, le run nocturne (`schedule`) et un push sur main
# partagent le groupe `CI-refs/heads/main` : avec
# `cancel-in-progress: true`, tout push pendant les Monte Carlo complets
# ANNULE le nightly en cours. Celui-ci dure jusqu'a 3 heures, et un run
# annule ne produit aucun resultat — ce qui explique qu'il n'ait jamais
# rien rapporte sur ce depot, ou les pushes sont frequents.
#
# `cancel-in-progress` est en outre desactive pour `schedule` : deux
# pushes qui se suivent doivent bien s'annuler (c'est l'intention
# d'origine), mais un run nocturne ne doit jamais l'etre, ni par un
# autre nightly ni par quoi que ce soit d'autre.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # validation/ n'est pas publié (outillage local) : le linter ne
      # voit que ce que le dépôt contient réellement.
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests

  types:
    name: Types (mypy strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Le typage est une propriété statique, pas un comportement
    # d'exécution : il est vérifié une fois, sur une version fixée, et
    # non répété sur toute la matrice.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # mypy et numpy sont ÉPINGLÉS ici, et c'est délibéré. Ce job avait
      # déjà pour intention affichée de ne pas dépendre des versions de
      # stubs résolues, mais il ne fixait que Python : le 2026-08-28 une
      # publication de numpy (2.5, où indexer `.shape` rend `Any`) a fait
      # échouer `main` sans le moindre changement de code.
      #
      # Une CI verte doit vouloir dire « ce code est correct », pas « les
      # stubs publiés aujourd'hui sont d'accord avec lui ». Monter ces
      # versions est donc un acte volontaire, fait dans un commit qui
      # corrige ce que la nouvelle version signale — et reproductible en
      # local par la même commande.
      - run: pip install "mypy==2.3.1" "numpy==2.5.2"
      - run: mypy --version && python -c "import numpy; print('numpy', numpy.__version__)"
      - run: mypy src/pyardl

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Les extras optionnels sont installés : sans arch, le verrou de
      # concordance DF-GLS est SKIP et la CI passerait au vert en ayant
      # sauté sa validation externe la plus importante.
      - name: Install (avec extras optionnels)
        run: pip install -e ".[dev,plot,bootstrap]"

      # -ra, et non -rs. `-rs` ne resume QUE les tests ignores : quand
      # macOS a signale 5 echecs le 2026-08-28, le resume final ne
      # contenait que des lignes SKIPPED et pas une seule ligne FAILED.
      # Le log etait donc inexploitable sans faire defiler des milliers
      # de lignes de traceback, et diagnostiquer revenait a deviner.
      #
      # Un resume qui tait ce qui a echoue est pire qu'absent : il a
      # l'air complet. `-ra` liste toutes les issues non passantes,
      # echecs compris, avec leur raison.
      - name: Pytest + doctests + couverture
        shell: bash
        run: |
          set -o pipefail
          pytest -m "not slow" -ra \
            --doctest-modules src/pyardl tests \
            --cov=pyardl --cov-report=term-missing --cov-report=xml \
            2>&1 | tee pytest-output.txt

      # Un test ignoré faute de dépendance ne doit jamais passer
      # inaperçu. Les seuls skips tolérés sont ceux qui attendent une
      # autorisation externe, marqués comme tels dans le code.
      - name: Aucun test ignoré pour cause de dépendance manquante
        shell: bash
        run: |
          if grep -q "could not import" pytest-output.txt; then
            echo "::error::Des tests ont été ignorés faute d'une dépendance :"
            grep "could not import" pytest-output.txt
            exit 1
          fi
          echo "OK : aucun skip pour dépendance manquante."

      # Le seuil de couverture est appliqué localement par pytest-cov
      # (fail_under = 90), qui fait échouer la suite avant cette étape.
      # Le rapport est conservé en artefact pour pouvoir être ouvert
      # depuis l'interface, sans dépendre d'un service tiers.
      - name: Conserver la couverture en artefact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # Les planchers DECLARES, testes une fois.
  #
  # La matrice ci-dessus installe toujours les versions les plus
  # recentes : elle verifie donc le HAUT de la plage annoncee par
  # pyproject.toml, jamais le bas. Or `dependencies` promet
  # numpy>=1.26, scipy>=1.11, pandas>=2.1, statsmodels>=0.14 — une
  # promesse que rien ne verifiait, et qui etait deja fausse : deux
  # tests utilisaient `freq="QE"`, un alias apparu en pandas 2.2.
  #
  # Le pendant de cette cellule est la lecon des pannes du 2026-08-28
  # (numpy 2.5 pour mypy, statsmodels 0.15 pour BoundsTestResult) : une
  # bibliotheque doit tenir sur la plage qu'elle annonce, pas sur le
  # point que l'environnement resout ce jour-la. Le haut est couvert par
  # la matrice, le bas l'est ici.
  #
  # Python 3.11 n'est pas un choix libre : c'est le minimum declare, et
  # numpy 1.26 n'a pas de roues au-dela de 3.12.
  #
  # Quand un plancher est monte dans pyproject.toml, il se monte AUSSI
  # ici — les deux listes disent la meme chose et doivent le dire
  # ensemble.
  floors:
    name: Tests (planchers declares)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # --no-deps sur le package lui-meme : pip ne doit PAS remonter les
      # versions qu'on vient d'epingler pour satisfaire ses bornes.
      - name: Install aux versions plancher
        run: |
          pip install \
            "numpy==1.26.*" "scipy==1.11.*" "pandas==2.1.*" \
            "statsmodels==0.14.0" "matplotlib==3.8.*" "arch==6.3.*" \
            "pytest>=8.0" "pytest-cov>=5.0"
          pip install --no-deps -e .

      - name: Versions effectivement installees
        run: |
          python -c "import sys, numpy, scipy, pandas, statsmodels, matplotlib, arch; \
            print('python', sys.version.split()[0]); \
            [print(f'{m.__name__:14s}{m.__version__}') for m in \
             (numpy, scipy, pandas, statsmodels, matplotlib, arch)]"

      # Pas de --cov ici : le seuil de couverture est deja applique par
      # la matrice principale, et le repeter n'ajouterait qu'une source
      # d'echec sans rapport avec la question posee — le code
      # fonctionne-t-il sur ses planchers ?
      - name: Pytest + doctests
        run: pytest -m "not slow" -ra --doctest-modules src/pyardl tests

  package:
    name: Paquet (build + métadonnées)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - name: Construire la roue et l'archive
        run: python -m build
      - name: Vérifier les métadonnées (rendu PyPI compris)
        run: twine check --strict dist/*

      # CITATION.cff porte une version qui ne peut pas etre dynamique :
      # c'est un fichier de metadonnees statique. Sans ce controle elle
      # derive en silence — elle avait deux releases de retard quand on
      # s'en est apercu.
      - name: CITATION.cff est a jour
        run: |
          python - <<'PY'
          import re, sys
          cff = open("CITATION.cff", encoding="utf-8").read()
          cff_version = re.search(r'^version:\s*(\S+)', cff, re.M).group(1).strip('"')
          ns = {}
          exec(open("src/pyardl/__init__.py", encoding="utf-8").read(), ns)
          if cff_version != ns["__version__"]:
              print(f"::error::CITATION.cff annonce {cff_version}, "
                    f"le paquet {ns['__version__']}.")
              sys.exit(1)
          print(f"OK : CITATION.cff et le paquet annoncent {cff_version}.")
          PY
      - name: Installer la roue dans un env vierge et importer
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "import pyardl; print('pyardl', pyardl.__version__)"

      # Sur un push d'etiquette : v0.4.0 doit livrer un paquet qui se
      # declare 0.4.0. Une etiquette posee sans avoir bumpe la version
      # produit une release mal nommee, et rien d'autre ne le detecte —
      # le paquet s'installe et s'importe parfaitement.
      - name: L'etiquette correspond a la version du paquet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(/tmp/fresh/bin/python -c "import pyardl; print(pyardl.__version__)")
          echo "etiquette=$tag  paquet=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::L'etiquette $GITHUB_REF_NAME ne correspond pas a la version $pkg."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: Documentation (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs]"
      # Garde : DEVIATIONS.md et QUESTIONS.md sont des fichiers de travail
      # gitignores. Un lien vers eux passe le controle local, ou ils
      # existent, et casse ici. On le detecte explicitement plutot que de
      # le lire dans un message de mkdocs. VALIDATION_OBSERVATIONS.md,
      # lui, est publie : les liens vers lui sont legitimes.
      - name: No link to an unpublished file
        run: |
          if grep -rnE '\]\([^)]*(DEVIATIONS|QUESTIONS)\.md' README.md docs/ 2>/dev/null; then
            echo "::error::Lien vers un fichier absent du depot (voir .gitignore)."
            exit 1
          fi
      # --strict transforme tout lien mort ou page orpheline en erreur.
      - run: mkdocs build --strict

  # Monte Carlo complets. DEUX choses l'empechaient d'aboutir, et les
  # deux sont corrigees ici et dans le bloc `concurrency` ci-dessus.
  #
  # 1. Il etait ANNULE par les pushes (voir `concurrency`).
  #
  # 2. Il ne tenait pas dans son budget. Mesure du 2026-08-28 :
  #    `test_full_pss_crosscheck_slow` fait a lui seul 110 appels a
  #    simulate_bounds a n_sims=100 000 et T=1000, soit ~68 minutes sur
  #    une machine locale — et un runner GitHub est deux a trois fois
  #    plus lent sur ce type de calcul. Ce test seul pouvait donc
  #    depasser les 170 minutes allouees a pytest, avant meme les seize
  #    autres.
  #
  #    Le budget passe a 350 minutes (le maximum d'un runner heberge est
  #    de 6 heures). Augmenter le temps plutot que reduire n_sims est
  #    delibere : la taille du Monte Carlo est un choix statistique fixe
  #    par la spec 12, pas une variable d'ajustement pour faire entrer
  #    un job dans une fenetre.
  nightly-slow:
    name: Monte Carlo complets (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,plot,bootstrap]"

      # Ressources avant/après : un échec à mi-parcours sans assertion
      # ressemble à un processus tué (mémoire), pas à un test rouge.
      # Sans cette trace, la cause reste indevinable.
      - name: Ressources de la machine
        run: |
          echo "--- mémoire ---"; free -h
          echo "--- disque ---"; df -h /
          echo "--- cœurs ---"; nproc

      # -v nomme chaque test au fil de l'eau : si le processus meurt, le
      # dernier nom affiché est le test en cours. --durations montre où
      # part le temps. Le rapport JUnit survit à un arrêt brutal.
      - name: Pytest slow
        run: >
          pytest -m slow -v -ra --durations=20
          --junit-xml=slow-results.xml
        timeout-minutes: 340

      - name: Mémoire après exécution
        if: always()
        run: free -h

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-results
          path: slow-results.xml
          if-no-files-found: warn
