name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: |
          ruff check src tests validation
          ruff format --check src tests validation
      - name: Mypy (strict)
        run: mypy src/ardlpy
      - name: Pytest (suite CI + réplications sur valeurs pré-générées)
        run: pytest -m "not slow" --doctest-modules src/ardlpy tests --cov=ardlpy

  nightly-slow:
    # Monte Carlo complets (recoupement des tables de CV, taille/puissance)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest slow
        run: pytest -m slow -q

# Pour activer le nightly, ajouter :
