[package]
name = "pyardl_rust"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Noyau natif de pyardl : la recursion du DGP nul du bootstrap."

[lib]
name = "pyardl_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
